/* MapServer Template */
<html>
<head>
    <title>GetFeatureInfo output</title>
</head>
<style type="text/css">table.featureInfo, table.featureInfo td, table.featureInfo th { border: 1px solid #ddd; border-collapse: collapse; margin: 0; padding: 0; font-size: 90%; padding: .2em .1em; } table.featureInfo th { padding: .2em .2em; font-weight: bold; background: #eee; } table.featureInfo td { background: #fff; } table.featureInfo tr.odd td { background: #eee; } table.featureInfo caption { text-align: left; font-size: 100%; font-weight: bold; padding: .2em .2em; }</style>
<body>

[resultset layer=drainagebasin]
<table class="featureInfo">
    <caption class="featureInfo">drainagebasin</caption>
    <tr>
        <th>area</th>
        <th>areaUnitOfMeasure</th>
        <th>beginlifespanversion</th>
        <th>localid</th>
        <th>namespace</th>
    </tr>
    [feature]
    <tr>
        <td>[area]</td>
        <td>[area_uom]</td>
        <td>[beginLifespanVersion]</td>
        <td>[localId]</td>
        <td>[namespace]</td>
    </tr>
    [/feature]
</table>
[/resultset]

</body>
</html>
